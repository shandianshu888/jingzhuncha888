  <script>
    (function() {
      var p = location.pathname.toLowerCase();
      var s = location.search;
      var q = new URLSearchParams(s);
      var postId = q.get('id') || q.get('post') || q.get('articleId');
      if (p.includes('/article') || p.includes('/post') || p.includes('/library')) {
        location.replace('library.html' + (postId ? '?id=' + postId : ''));
      } else if (p.includes('/airport')) {
        var airportId = q.get('id') || q.get('name');
        location.replace('airport.html' + (airportId ? '?id=' + airportId : ''));
      }
    })();
  </script>
